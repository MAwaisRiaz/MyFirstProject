name: CI/CD Pipeline for Spring Boot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # (Ab se browser par 'Run workflow' ka button hamesha nazar aayega)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Copy JAR file to AWS EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        source: "target/MyFirstProject-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/"
        strip_components: 1

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.2.1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/ubuntu
          mv -f MyFirstProject-0.0.1-SNAPSHOT.jar app.jar || true
          sudo killall -9 java || true
          sudo docker compose down -v
          sudo docker compose up -d
          sleep 20
          nohup java -jar app.jar --spring.datasource.url=jdbc:mysql://localhost:3306/journal_db?createDatabaseIfNotExist=true --spring.datasource.username=root --spring.datasource.password=rootpassword > app.log 2>&1 &
